[package]
name = "music-groomer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/cark/music-groomer"

[dependencies]
directories = "6"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lofty = "0.25.1"
mp4parse = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"
